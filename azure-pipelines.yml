# ============================================================
# Trigger
# ============================================================

# Trigger the pipeline whenever code is pushed to main
trigger:
- main


# ============================================================
# Build Agent
# ============================================================

# Use a Microsoft-hosted Ubuntu agent
pool:
  name: Azure-DevOps-SelfHosted


# ============================================================
# Variables
# ============================================================

variables:

  # ----------------------------------------------------------
  # Application
  # ----------------------------------------------------------

  # Azure App Service name
  appName: 'baludotnetapp'

  # Azure Resource Group
  resourceGroup: 'rg-dotnet-app'


  # ----------------------------------------------------------
  # Azure Service Connections
  # ----------------------------------------------------------

  # Service connection used by Docker@2 to push images to ACR
  dockerRegistryServiceConnection: 'ACR-Production-DotNetApp'

  # Service connection used to deploy to Azure App Service
  azureSubscription: 'Azure-Production-DotNetApp'


  # ----------------------------------------------------------
  # Azure Container Registry
  # ----------------------------------------------------------

  # ACR login server
  containerRegistry: 'baludotnetacr.azurecr.io'

  # Docker repository/image name inside ACR
  imageRepository: 'mydotnetapp'


  # ----------------------------------------------------------
  # Docker
  # ----------------------------------------------------------

  # Location of the Dockerfile
  dockerfilePath: '$(Build.SourcesDirectory)/Dockerfile'

  # Azure DevOps Build ID used as the image version
  imageTag: '$(Build.BuildId)'

  # Container port
  containerPort: '8080'


  # ----------------------------------------------------------
  # Docker Image
  # ----------------------------------------------------------

  # Complete image name
  imageName: '$(containerRegistry)/$(imageRepository)'

  # Complete versioned image
  imageVersion: '$(imageName):$(imageTag)'

  # Latest image
  imageLatest: '$(imageName):latest'


# ============================================================
# Steps
# ============================================================

steps:

  # ==========================================================
  # STEP 1 — Build and Push Docker Image to ACR
  # ==========================================================

  - task: Docker@2
    displayName: 'Build and push Docker image to ACR'

    inputs:

      # Build the Docker image and push it to ACR
      command: 'buildAndPush'

      # Docker repository name
      repository: '$(imageRepository)'

      # Dockerfile location
      dockerfile: '$(dockerfilePath)'

      # ACR service connection
      containerRegistry: '$(dockerRegistryServiceConnection)'

      # Create version and latest tags
      tags: |
        $(imageTag)
        latest


  # ==========================================================
  # STEP 2 — Deploy Docker Image to Azure App Service
  # ==========================================================

  - task: AzureWebAppContainer@1
    displayName: 'Deploy Docker container to Azure App Service'

    inputs:

      # Azure service connection
      azureSubscription: '$(azureSubscription)'

      # Target App Service
      appName: '$(appName)'

      # Docker image to deploy
      containers: '$(imageVersion)'