# Trigger the pipeline whenever code is pushed to the main branch
trigger:
- main

# Use a Microsoft-hosted Ubuntu agent to run the pipeline
pool:
  vmImage: ubuntu-latest

# Define reusable variables for Docker and Azure resources
variables:

  # Name of the Docker image/repository inside ACR
  imageRepository: 'mydotnetapp'

  # Azure DevOps service connection used to authenticate with ACR
  dockerRegistryServiceConnection: 'ACR-Production-DotNetApp'

  # Azure Container Registry URL
  containerRegistry: 'baludotnetacr.azurecr.io'

  # Location of the Dockerfile in the source repository
  dockerfilePath: '$(Build.SourcesDirectory)/Dockerfile'

  # Use the Azure DevOps build ID as the Docker image tag
  imageTag: '$(Build.BuildId)'

steps:

# ============================================================
# STEP 1: Build Docker image and push it to Azure Container Registry
# ============================================================
- task: Docker@2
  displayName: 'Build and push Docker image to ACR'
  inputs:

    # Build the Docker image and push it to the registry
    command: 'buildAndPush'

    # Docker repository/image name
    repository: '$(imageRepository)'

    # Location of the Dockerfile
    dockerfile: '$(dockerfilePath)'

    # Service connection used to authenticate with ACR
    containerRegistry: '$(dockerRegistryServiceConnection)'

    # Create two tags for the image
    tags: |
      $(imageTag)
      latest


# ============================================================
# STEP 2: Deploy the Docker image to Azure App Service
# ============================================================
- task: AzureWebAppContainer@1
  displayName: 'Deploy Docker container to Azure App Service'
  inputs:

    # Azure DevOps service connection used to access Azure
    azureSubscription: 'Azure-Production-DotNetApp'

    # Target Azure App Service
    appName: 'baludotnetapp'

    # Full Docker image name that App Service will run
    containers: '$(containerRegistry)/$(imageRepository):$(imageTag)'