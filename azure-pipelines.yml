trigger:
- main

pool:
  vmImage: ubuntu-latest

steps:

# Install .NET 10
- task: UseDotNet@2
  displayName: 'Install .NET 10'
  inputs:
    packageType: 'sdk'
    version: '10.x'

# Restore NuGet packages
- task: DotNetCoreCLI@2
  displayName: 'Restore NuGet packages'
  inputs:
    command: 'restore'
    projects: '**/*.csproj'

# Build the application
- task: DotNetCoreCLI@2
  displayName: 'Build ASP.NET Core application'
  inputs:
    command: 'build'
    projects: '**/*.csproj'
    arguments: '--configuration Release --no-restore'

# Publish the application
- task: DotNetCoreCLI@2
  displayName: 'Publish ASP.NET Core application'
  inputs:
    command: 'publish'
    projects: '**/*.csproj'
    arguments: '--configuration Release --output $(Build.ArtifactStagingDirectory)/publish --no-build'
    zipAfterPublish: true

# Publish the build artifact
- task: PublishBuildArtifacts@1
  displayName: 'Publish application artifact'
  inputs:
    pathToPublish: '$(Build.ArtifactStagingDirectory)/publish'
    artifactName: 'drop'

# Deploy to Azure App Service
- task: AzureWebApp@1
  displayName: 'Deploy to Azure App Service'
  inputs:
    azureSubscription: 'Azure-Production-DotNetApp'
    appType: 'webAppLinux'
    appName: 'baludotnetapp'
    package: '$(Build.ArtifactStagingDirectory)/publish/*.zip'